# Weekly dependency updates, as pull requests against develop. Minor and patch updates
# come grouped, so there is one pull request per ecosystem instead of dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gradle
    directory: /apps/android
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
